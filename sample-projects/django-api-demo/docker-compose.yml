services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contextforge_tasks
      POSTGRES_USER: contextforge
      POSTGRES_PASSWORD: contextforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: dev-secret
      DATABASE_URL: postgres://contextforge:contextforge@db:5432/contextforge_tasks
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres-data:
